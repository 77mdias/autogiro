# Desenvolvimento com hot reload, segredos do Criptenv e nenhum .env no disco.
#
#   pnpm docker:up     (= docker compose -f compose.dev.yaml up --build --watch, credenciais do chaveiro)
#
# O Compose Watch copia para o container o que você edita no host; o next dev recarrega na hora.
# Mudou package.json ou pnpm-lock.yaml: a imagem é refeita sozinha. Mudou next.config.ts: o container reinicia.
# Mesmo projeto e serviço do compose.yaml: subir um substitui o outro na porta 3000.
services:
  app:
    build:
      context: .
      target: dev
    image: autogiro:dev
    init: true
    ports:
      - "3000:3000"
    environment:
      CRIPTENV_PROJECT: ${CRIPTENV_PROJECT:-659a2c2d-a35d-4801-b83e-b3d4d757362b}
      CRIPTENV_ENV: ${CRIPTENV_ENV:-development}
    secrets:
      - criptenv_api_key
      - criptenv_vault_password
    tmpfs:
      - /tmp # sessão temporária do criptenv
    volumes:
      - next-dev:/app/.next # cache do Turbopack entre reinícios
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    develop:
      watch:
        - { action: sync, path: ./src, target: /app/src }
        - { action: sync, path: ./public, target: /app/public }
        - { action: sync, path: ./drizzle, target: /app/drizzle }
        - { action: sync, path: ./scripts, target: /app/scripts }
        - { action: sync+restart, path: ./next.config.ts, target: /app/next.config.ts }
        - { action: sync+restart, path: ./tsconfig.json, target: /app/tsconfig.json }
        - { action: sync, path: ./drizzle.config.ts, target: /app/drizzle.config.ts }
        - { action: rebuild, path: ./package.json }
        - { action: rebuild, path: ./pnpm-lock.yaml }

secrets:
  criptenv_api_key:
    environment: CRIPTENV_API_KEY
  criptenv_vault_password:
    environment: CRIPTENV_VAULT_PASSWORD

volumes:
  next-dev:
